[project]
name = "stock-assistant-backend"
version = "0.1.0"
description = "Personal AI Stock Market Assistant (Indian equities) - decision support, paper trading only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "yfinance>=0.2.54",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Query() defaults are idiomatic

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
