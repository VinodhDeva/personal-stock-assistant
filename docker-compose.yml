services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stocks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stocks}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DASHBOARD_URL: http://localhost:8080
      # Ollama runs on the host machine, not in a container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./data:/srv/data]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
